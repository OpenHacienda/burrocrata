name: dgt-qwen3-8b-lora-v1
base_model: unsloth/Qwen3-8B-bnb-4bit
dataset:
  source: local
  path: datasets/dgt-sft
  split: train
  eval_split: validation
prompt: dgt_sft
lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target: all-linear
train:
  epochs: 1.0
  lr: 2.0e-4
  batch_size: 2
  grad_accum: 8
  max_seq: 4096
  seed: 42
eval:
  every_steps: 200
hub:
  push: false
